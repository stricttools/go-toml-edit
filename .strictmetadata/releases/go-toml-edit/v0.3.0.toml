# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Position spans on every AST node: Span() exposes 1-based start/end line and column from the most recent parse."
# Optional context explaining why these changes were made
context = "Consumers doing their own semantic validation over the AST (unknown keys, wrong types, out-of-range values) previously had positions only on ParseError. Spans are populated from lexer tokens at parse time and are deliberately not recomputed by edits: nodes created programmatically carry the zero (invalid) span, and edited documents must be re-parsed for fresh positions."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go"]
exclude = []
release_commit = "dc679b37a0e633c8926b2a49af7f7d9a96791428"

