name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-SHA group: re-runs of the same commit dedupe, but a new commit never
# cancels an earlier commit's in-flight run (release CI conclusions stay intact).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # The job name must stay `test`: the publish workflow's check matcher is
  # `^(test)( \(.*\))?$`, which accepts the matrix suffix but not a rename.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both versions are read from go.mod, never typed here:
        # - floor: the go directive, the consumers' minimum (iterator types
        #   need 1.23).
        # - development: the toolchain line, the Go used for local development.
        go: [floor, development]
    # Use exactly the Go that setup-go installed. Under the default
    # GOTOOLCHAIN=auto the floor leg would see go.mod's newer toolchain line and
    # silently switch to it, testing nothing about the floor.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - name: Read the go directive
        if: matrix.go == 'floor'
        id: floor
        run: echo "version=$(awk '$1 == "go" { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        if: matrix.go == 'floor'
        with:
          go-version: ${{ steps.floor.outputs.version }}
      # setup-go reads go.mod's toolchain line first, then its go directive.
      - uses: actions/setup-go@v6
        if: matrix.go == 'development'
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: staticcheck
        # staticcheck v0.8.1 needs go >= 1.26 to build, so the lint runs on
        # the development leg only; the floor leg's job is proving the library
        # itself builds and tests on the minimum Go.
        if: matrix.go == 'development'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - run: go test ./... -race -short -timeout=10m
